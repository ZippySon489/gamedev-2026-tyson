<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>t1a03-forms-tyson.html - Modernized</title>
    <!-- Tailwind CSS for modern styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen py-10 px-4 sm:px-6">

    <div class="max-w-3xl mx-auto bg-white rounded-2xl shadow-xl border border-slate-100 overflow-hidden">
        
        <!-- Header Section -->
        <div class="bg-gradient-to-r from-emerald-600 to-teal-700 p-6 sm:p-8 text-white">
            <div class="flex justify-between items-center mb-2">
                <span class="bg-emerald-500/30 text-emerald-100 text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">Version 0.0.2 (Modernized)</span>
                <span class="text-emerald-100 text-sm">t1a03-forms-tyson.html</span>
            </div>
            <h1 class="text-2xl sm:text-3xl font-bold tracking-tight">Proving that you can use: Forms 2026</h1>
            <p class="text-emerald-100 mt-1 text-sm">A clean, robust, and fully interactive form element demonstration.</p>
        </div>

        <!-- Form Body -->
        <form id="mainForm" class="p-6 sm:p-8 space-y-6" onsubmit="handleFormSubmit(event)" onreset="handleFormReset()">
            
            <!-- Grid for Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                
                <!-- Text Input -->
                <div class="space-y-2">
                    <label for="myText01" class="block text-sm font-medium text-slate-700">First Name</label>
                    <input type="text" id="myText01" value="Tyson" 
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition text-slate-800"
                        oninput="updateStatus('First name changed to: ' + this.value)">
                </div>

                <!-- Select Dropdown -->
                <div class="space-y-2">
                    <label for="mySelect01" class="block text-sm font-medium text-slate-700">Select Pet</label>
                    <select id="mySelect01" 
                        class="w-full px-4 py-2.5 rounded-lg border border-slate-300 focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 outline-none transition bg-white text-slate-800"
                        onchange="updateStatus('Selected pet: ' + this.options[this.selectedIndex].text)">
                        <option value="myDog">Dog</option>
                        <option value="myCat">Cat</option>
                        <option value="myMouse">Mouse</option>
                    </select>
                </div>

            </div>

            <!-- Checkboxes Section -->
            <div class="space-y-2 pt-2 border-t border-slate-100">
                <label class="block text-sm font-medium text-slate-700">Dietary Preferences (Checkboxes)</label>
                <div class="flex flex-wrap gap-6 mt-1">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="checkBeef" value="Beef" 
                            class="w-4 h-4 text-emerald-600 border-slate-300 rounded focus:ring-emerald-500"
                            onchange="updateStatus('Beef preference: ' + (this.checked ? 'Checked' : 'Unchecked'))">
                        <span class="text-sm text-slate-700">Beef</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" id="checkVeggy" value="Veggy" 
                            class="w-4 h-4 text-emerald-600 border-slate-300 rounded focus:ring-emerald-500"
                            onchange="updateStatus('Veggy preference: ' + (this.checked ? 'Checked' : 'Unchecked'))">
                        <span class="text-sm text-slate-700">Veggy</span>
                    </label>
                </div>
            </div>

            <!-- Radio Buttons Section -->
            <div class="space-y-2 pt-2 border-t border-slate-100">
                <label class="block text-sm font-medium text-slate-700">Radio Frequency (Radio Buttons)</label>
                <div class="flex flex-wrap gap-6 mt-1">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="myRad01" value="95.4" 
                            class="w-4 h-4 text-emerald-600 border-slate-300 focus:ring-emerald-500"
                            onchange="updateStatus('Radio station selected: ' + this.value)">
                        <span class="text-sm text-slate-700">95.4 FM</span>
                    </label>
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="radio" name="myRad01" value="101" 
                            class="w-4 h-4 text-emerald-600 border-slate-300 focus:ring-emerald-500"
                            onchange="updateStatus('Radio station selected: ' + this.value)">
                        <span class="text-sm text-slate-700">101 FM</span>
                    </label>
                </div>
            </div>

            <!-- Hidden & File Inputs -->
            <div class="grid grid-cols-1 md:grid-cols-2 gap-6 pt-2 border-t border-slate-100">
                <div class="space-y-2">
                    <!-- Hidden field demo indicator -->
                    <input type="hidden" id="myHidden" value="SecretTysonData2026">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wide">Hidden Input Active</span>
                    <p class="text-xs text-slate-500">Value stored securely in hidden payload.</p>
                </div>

                <div class="space-y-2">
                    <label for="myFile" class="block text-sm font-medium text-slate-700">Upload File</label>
                    <input type="file" id="myFile" 
                        class="w-full text-sm text-slate-500 file:mr-4 file:py-2 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-emerald-50 file:text-emerald-700 hover:file:bg-emerald-100 transition cursor-pointer"
                        onchange="updateStatus('File selected: ' + (this.files[0] ? this.files[0].name : 'None'))">
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-3 pt-4 border-t border-slate-100">
                <!-- Custom Action Button matching original logic -->
                <button type="button" 
                    onclick="document.getElementById('myArea01').value = 'Cool! Custom button clicked successfully.'; updateStatus('Custom click button activated.');"
                    class="px-5 py-2.5 bg-emerald-600 hover:bg-emerald-700 text-white font-medium rounded-lg shadow-sm transition">
                    Click Me
                </button>

                <!-- Reset Button -->
                <button type="reset" 
                    class="px-5 py-2.5 bg-slate-200 hover:bg-slate-300 text-slate-700 font-medium rounded-lg transition">
                    Reset Form
                </button>

                <!-- Submit Button -->
                <button type="submit" 
                    class="px-5 py-2.5 bg-teal-600 hover:bg-teal-700 text-white font-medium rounded-lg shadow-sm transition ml-auto">
                    Submit Form
                </button>
            </div>

            <!-- Textarea / Output Area -->
            <div class="space-y-2 pt-2 border-t border-slate-100">
                <label for="myArea01" class="block text-sm font-medium text-slate-700">Status / Output Console Area</label>
                <textarea id="myArea01" rows="3" 
                    class="w-full px-4 py-2.5 rounded-lg border border-slate-300 bg-slate-50 text-slate-700 font-mono text-sm focus:outline-none"
                    placeholder="Interactive feedback will appear here...">Form loaded successfully and ready for interaction.</textarea>
            </div>

        </form>
    </div>

    <!-- Notification Message Box (Modal substitute for alert) -->
    <div id="msgBox" class="fixed bottom-5 right-5 bg-slate-900 text-white px-5 py-3 rounded-xl shadow-2xl opacity-0 transition-opacity duration-300 pointer-events-none flex items-center space-x-3 z-50">
        <span id="msgBoxText" class="text-sm font-medium">Notification message</span>
    </div>

    <script>
        // Function to update the text area and trigger subtle UI feedback
        function updateStatus(message) {
            const area = document.getElementById('myArea01');
            const timestamp = new Date().toLocaleTimeString();
            area.value = `[${timestamp}] ${message}`;
        }

        // Handle form submission event cleanly without alerts
        function handleFormSubmit(event) {
            event.preventDefault();
            const name = document.getElementById('myText01').value;
            const pet = document.getElementById('mySelect01').value;
            
            updateStatus(`Form submitted successfully for user: ${name} with pet selection: ${pet}!`);
            showToast('Form successfully submitted!');
        }

        // Handle form reset event
        function handleFormReset() {
            updateStatus('Form fields have been reset to default values.');
            showToast('Form reset.');
        }

        // Custom non-intrusive toast message box
        function showToast(text) {
            const box = document.getElementById('msgBox');
            const boxText = document.getElementById('msgBoxText');
            boxText.innerText = text;
            box.classList.remove('opacity-0', 'pointer-events-none');
            box.classList.add('opacity-100');

            setTimeout(() => {
                box.classList.remove('opacity-100');
                box.classList.add('opacity-0', 'pointer-events-none');
            }, 3000);
        }
    </script>
</body>
</html>
